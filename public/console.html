<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华充电运营中心</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#087e63;--accent-soft:#dff4ed;--nav:#102b25}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ZH</span><div>知华充电<small>EV CHARGE CLOUD</small></div></div><nav class="nav"><div class="active">运营驾驶舱</div><div>场站与设备</div><div>充电订单</div><div>计费策略</div><div>用户与钱包</div><div>运维工单</div><div>财务对账</div><div>审计中心</div></nav><div class="sidebar-foot">上海如静知华信息科技有限公司</div></aside><main class="main">
<header class="top"><div><h1>充电运营驾驶舱</h1><div class="muted">场站经营、设备可用率与充电履约实时视图</div></div><span class="status"><i class="dot"></i>平台服务正常</span></header><section class="metrics" id="metrics"></section>
<div class="grid"><section class="card"><div class="section-title"><h2>充电枪实时状态</h2><button class="button">接入设备</button></div><div class="table-wrap"><table class="table"><thead><tr><th>设备</th><th>场站</th><th>功率</th><th>协议</th><th>状态</th></tr></thead><tbody id="connectors"></tbody></table></div></section><aside class="card"><div class="section-title"><h2>运维待办</h2><span class="muted">按风险排序</span></div><div id="orders"></div></aside></div>
<div class="grid equal"><section class="card"><div class="section-title"><h2>近期充电订单</h2><span class="muted">费用实时累计</span></div><div id="sessions"></div></section><section class="card"><div class="section-title"><h2>经营概况</h2><span class="pill">今日</span></div><div class="mini-grid"><div class="mini"><span class="muted">设备可用率</span><strong id="availability">--</strong></div><div class="mini"><span class="muted">单枪能效</span><strong>92.4%</strong></div><div class="mini"><span class="muted">平均服务时长</span><strong>36 min</strong></div><div class="mini"><span class="muted">支付成功率</span><strong>99.8%</strong></div></div></section></div>
</main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={stations:'场站',connectors:'充电枪',available:'可用',charging:'充电中',energyKwh:'累计电量',revenue:'已收金额',openWorkOrders:'待处理工单'};metrics.innerHTML=Object.entries(d.metrics).slice(0,5).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${k==='revenue'?'¥':''}${v}${k==='energyKwh'?' kWh':''}</strong><em>数据已更新</em></div>`).join('');connectors.innerHTML=d.connectors.map(x=>`<tr><td><strong>${esc(x.code)}</strong></td><td>${esc(d.stations.find(s=>s.id===x.stationId)?.name||'--')}</td><td>${x.ratedPowerKw} kW</td><td>${esc(x.protocol)}</td><td><span class="pill ${x.status==='fault'?'danger':x.status==='charging'?'warning':''}">${esc(x.status)}</span></td></tr>`).join('');orders.innerHTML=d.workOrders.length?d.workOrders.map(x=>`<div class="list-row"><div><strong>${esc(x.code)}</strong><span class="muted">${esc(x.description)}</span></div><span class="pill danger">${esc(x.severity)}</span></div>`).join(''):'<div class="empty">暂无待办</div>';sessions.innerHTML=d.sessions.map(x=>`<div class="list-row"><div><strong>${esc(x.id)}</strong><span class="muted">${x.energyKwh} kWh · ${esc(x.status)}</span></div><strong>¥${x.totalAmount.toFixed(2)}</strong></div>`).join('');availability.textContent=d.metrics.connectors?`${(d.metrics.available/d.metrics.connectors*100).toFixed(1)}%`:'--'})</script></body></html>
