<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华充电用户端</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#087e63;--accent-soft:#dff4ed;--nav:#102b25}</style></head><body><main class="client">
<section class="hero"><div><span class="pill">知华充电 · 上海</span><h1>附近好桩，即刻启程</h1><p>实时查询空闲枪位、透明电价与充电进度</p></div><div class="hero-stat"><span>账户余额</span><strong>¥100.00</strong><span>园区员工账户</span></div></section>
<div class="tabs"><button class="tab active">附近场站</button><button class="tab">充电中</button><button class="tab">订单</button><button class="tab">我的车辆</button></div>
<section class="grid"><div class="card"><div class="section-title"><h2>知华科技上海示范站</h2><span class="pill">营业中</span></div><p class="muted">上海市企业园区A座 · 距离 0.8 km · 120分钟停车减免</p><div class="mini-grid"><div class="mini"><span class="muted">可用快充</span><strong id="available">-- / --</strong></div><div class="mini"><span class="muted">当前电价</span><strong>¥1.47/kWh</strong></div></div><div class="list-row"><div><strong>ZH-DC-001-A</strong><span class="muted">120kW · OCPP 1.6J</span></div><button class="button">扫码充电</button></div><div class="list-row"><div><strong>ZH-DC-001-B</strong><span class="muted">120kW · 设备维护中</span></div><span class="pill danger">故障</span></div></div>
<aside class="card"><div class="section-title"><h2>当前充电</h2><span class="pill">进行中</span></div><div class="kpi-line"><strong style="font-size:32px" id="energy">-- kWh</strong><span>预计还需 26 分钟</span></div><div class="progress"><i style="width:62%"></i></div><div class="list-row"><span class="muted">实时费用</span><strong id="cost">¥--</strong></div><div class="list-row"><span class="muted">当前功率</span><strong>92.6 kW</strong></div><button class="button" style="width:100%;margin-top:12px">结束充电</button></aside></section>
<p class="footer-note">上海如静知华信息科技有限公司 · <a href="https://www.zhuatech.cn/">www.zhuatech.cn</a></p></main><script>fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{available.textContent=`${d.metrics.available} / ${d.metrics.connectors}`;energy.textContent=`${d.metrics.energyKwh} kWh`;const active=d.sessions.find(x=>x.status==='charging');cost.textContent=`¥${active?.totalAmount?.toFixed(2)||'0.00'}`})</script></body></html>
